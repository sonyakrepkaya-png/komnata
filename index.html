<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Комната, в которой мы живём</title>

    <!-- шрифт Alice из Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Alice&display=swap"
      rel="stylesheet"
    />

    <link href="./stylesheets/style.css" rel="stylesheet" />
  </head>
  <body>
    <!-- ЭКРАН 1: обложка.
         Свечение рисует glow.js на холстах (canvas) с классом glow:
         data-for — какие фигуры светятся, data-color — цвет свечения.
         Размытия (data-blur) взяты из макета Figma. -->
    <section class="cover">
      <div class="stage">
        <!-- левая голова с мебелью -->
        <div class="cover_group cover_group_left">
          <canvas class="glow" data-for="#head_left" data-color="#fae2ae"></canvas>
          <svg class="layer" viewBox="0 0 1440 820" aria-hidden="true">
            <path id="head_left" data-blur="1.8168 3.6336 12.7176 25.4352 43.6032 76.3056" d="M361 160C258.28 160 185.32 198.259 185.32 272.137C185.32 309.077 189.16 343.377 193 363.166C166.12 351.293 145 364.485 145 390.871C145 418.575 160.36 452.876 193 458.153C200.68 518.839 227.56 578.206 275.56 619.103C302.44 641.53 329.32 660 361 660C392.68 660 419.56 641.53 446.44 619.103C494.44 578.206 521.32 518.839 529 458.153C561.64 452.876 577 418.575 577 390.871C577 364.485 555.88 351.293 529 363.166C532.84 343.377 536.68 309.077 536.68 272.137C536.68 198.259 463.72 160 361 160Z" fill="#FAE2AE" stroke="#FAE2AE" stroke-width="33" />
          </svg>

          <canvas class="glow" data-for=".furniture_left path" data-color="#3e0703"></canvas>
          <svg class="layer" viewBox="0 0 1440 820" aria-hidden="true">
            <g class="furniture_left" fill="none" stroke="#3E0703" stroke-width="5">
              <!-- диван -->
              <path transform="translate(0 34.5)" data-blur="7.50865 15.0173 52.5605 105.121 125 125" d="M202.637 343.729L191.336 326.635C184.932 316.949 186.663 306.797 194.346 301.718L264.844 255.109C272.527 250.03 282.546 252.414 288.949 262.1L300.251 279.194L293.924 283.377L302.211 295.912L217.251 352.082L208.964 339.546L202.637 343.729ZM190.435 346.883C183.656 351.365 183.356 359.752 189.006 368.299L204.828 392.23C210.478 400.777 218.011 402.347 224.338 398.165L227.05 396.372L235.337 408.907L243.472 403.529L237.896 389.201L328.279 329.447L339.278 340.19L347.412 334.812L339.124 322.276L341.836 320.484C348.163 316.301 349.668 308.755 344.018 300.208L328.196 276.277C322.546 267.73 314.711 264.721 307.933 269.202C301.154 273.684 301.23 282.641 306.504 290.618L314.415 302.583L218.609 365.923L210.698 353.957C205.424 345.98 197.213 342.402 190.435 346.883Z" />
              <!-- лампа -->
              <path transform="translate(140.5 51.5)" data-blur="5.535 11.07 38.745 77.49 125 125" d="M286.5 252.5H338.5L372.5 314C372.5 316.563 371.167 317.844 368.5 317.844H318.5V362.047H342.5C351.833 362.047 356.5 366.531 356.5 375.5H268.5C268.5 366.531 273.167 362.047 282.5 362.047H306.5V317.844H256.5C253.833 317.844 252.5 316.563 252.5 314L286.5 252.5Z" />
              <!-- кресло -->
              <path transform="translate(1.6 203.6)" data-blur="9.585 19.17 67.095 125 125 125" d="M284.418 313.383L284.178 281.384C284.036 262.384 296.968 253.287 314.968 253.153L401.965 252.502C419.965 252.367 433.032 261.269 433.174 280.269L433.413 312.268C437.376 307.238 442.353 304.201 449.353 304.148C459.353 304.073 465.413 312.028 465.495 323.028L459.809 365.072C458.884 375.079 452.937 382.124 442.959 385.198L439.132 408.228L425.132 408.332L420.975 387.363L297.978 388.283L294.136 409.313L280.136 409.418L275.964 386.448C265.942 383.523 259.89 376.568 258.815 366.576L252.501 324.622C252.418 313.622 258.358 305.578 268.358 305.503C275.358 305.45 280.38 308.413 284.418 313.383Z" />
            </g>
          </svg>
        </div>

        <!-- правая голова с заголовком -->
        <div class="cover_group cover_group_right">
          <canvas class="glow" data-for="#head_right" data-color="#fae2ae"></canvas>
          <svg class="layer" viewBox="0 0 1440 820" aria-hidden="true">
            <path id="head_right" transform="translate(588.89 0)" data-blur="1.8168 3.6336 12.7176 25.4352 43.6032 76.3056" d="M449.111 47C315.956 47 221.378 102.551 221.378 209.823C221.378 263.459 226.356 313.264 231.334 341.997C196.489 324.757 169.111 343.913 169.111 382.224C169.111 422.451 189.022 472.256 231.334 479.918C241.289 568.034 276.134 654.235 338.356 713.617C373.2 746.182 408.045 773 449.111 773C490.178 773 525.022 746.182 559.867 713.617C622.089 654.235 656.934 568.034 666.889 479.918C709.2 472.256 729.111 422.451 729.111 382.224C729.111 343.913 701.734 324.757 666.889 341.997C671.867 313.264 676.845 263.459 676.845 209.823C676.845 102.551 582.267 47 449.111 47Z" fill="#FAE2AE" stroke="#FAE2AE" stroke-width="33" />
          </svg>

          <canvas class="glow" data-for=".cover_line" data-color="#3e0703"></canvas>
          <h1 class="cover_title">
            <span class="cover_line cover_line1" data-blur="23.6 47.25 125 125 125 125">КОМНАТА</span>
            <span class="cover_line cover_line2" data-blur="17.2 34.4 120.3 125 125 125">В КОТОРОЙ,</span>
            <span class="cover_line cover_line3" data-blur="10.3 35.9 71.8 123.1 125">МЫ</span>
            <span class="cover_line cover_line4" data-blur="11.4 22.8 79.7 125 125 125">ЖИВЕМ</span>
          </h1>
        </div>
      </div>
    </section>

    <!-- ПЕРЕХОД: дверь (вариант А).
         Секция высокая, а экран внутри неё «прилипает» на месте;
         door.js по прокрутке рисует линии двери, зажигает свет
         в проёме и приближает нас к нему. -->
    <section class="door">
      <div class="door_sticky">
        <div class="stage">
          <div class="door_zoom">
            <!-- свет в проёме -->
            <canvas class="glow door_glow_gap" data-for=".door_gap_shape" data-color="#ffefba"></canvas>
            <!-- свечение линий двери -->
            <canvas class="glow door_glow_lines" data-for=".door_lines path" data-blur="5.5 47" data-gain="1.6 3" data-color="#ffefba"></canvas>

            <svg class="layer" viewBox="0 0 1440 820" aria-hidden="true">
              <g transform="translate(582.4 190.4)">
                <!-- проём между створкой и рамкой -->
                <path class="door_gap_shape" data-blur="6 30 90" data-gain="0.9 0.8 0.7" d="M61.55 27.05H228.8V381.64H192.12V66.79Z" fill="#FFEFBA" stroke="none" />
                <!-- линии двери из макета: каждый штрих отдельно,
                     чтобы они прорисовывались по очереди, как пером -->
                <g class="door_lines" fill="none" stroke="#FFEFBA" stroke-width="5.19659" stroke-linecap="round" stroke-linejoin="round">
                  <path pathLength="1" d="M14.8257 399.985V11.7688C14.8257 5.65512 17.8825 2.5983 23.9961 2.5983H244.087C250.201 2.5983 253.257 5.65512 253.257 11.7688V399.985" />
                  <path pathLength="1" d="M14.8257 399.985H2.59839" />
                  <path pathLength="1" d="M14.8257 399.985H39.2802" />
                  <path pathLength="1" d="M253.257 399.985H192.121" />
                  <path pathLength="1" d="M253.257 399.985H271.598" />
                  <path pathLength="1" d="M192.121 399.985V427.496L179.894 436.666L39.2802 381.644V330.289" />
                  <path pathLength="1" d="M39.2802 330.289V302.166" />
                  <path pathLength="1" d="M39.2802 330.289L48.4507 332.735V304.612L39.2802 302.166" />
                  <path pathLength="1" d="M39.2802 302.166V128.539" />
                  <path pathLength="1" d="M39.2802 128.539V100.416" />
                  <path pathLength="1" d="M39.2802 128.539L48.4507 130.985V102.862L39.2802 100.416" />
                  <path pathLength="1" d="M61.5513 27.0528L51.5075 23.996L39.2802 27.0528V100.416" />
                  <path pathLength="1" d="M39.2802 27.0528H61.5513" />
                  <path pathLength="1" d="M39.2802 27.0528L179.894 69.8483" />
                  <path pathLength="1" d="M61.5513 27.0528H228.803V381.644H192.121" />
                  <path pathLength="1" d="M192.121 381.644V66.7915L61.5513 27.0528" />
                  <path pathLength="1" d="M186.007 399.985H192.121" />
                  <path pathLength="1" d="M192.121 399.985V381.644" />
                  <path pathLength="1" d="M186.007 381.644H192.121" />
                  <path pathLength="1" d="M179.894 69.8483V436.666" />
                  <path pathLength="1" d="M179.894 69.8483L192.121 66.7915" />
                  <path pathLength="1" d="M158.427 232.534C157.939 237.151 159.592 243.052 163.387 244.087C170.112 245.921 170.112 228.803 163.387 226.969C160.457 226.17 158.803 228.969 158.427 232.534Z" />
                  <path pathLength="1" d="M158.427 232.534L162.776 233.694" />
                  <path pathLength="1" d="M158.427 232.534L135.264 226.357C132.004 225.542 130.373 226.765 130.373 230.026" />
                  <path pathLength="1" d="M162.164 253.257V260.594" />
                  <path pathLength="1" d="M208.628 45.3938L210.462 357.189" />
                  <path pathLength="1" d="M206.794 106.53L208.017 186.007" />
                  <path pathLength="1" d="M208.017 277.712L208.628 326.621" />
                  <path pathLength="1" d="M63.7348 75.9619L155.439 103.473V210.462L63.7348 189.676V75.9619Z" />
                  <path pathLength="1" d="M75.962 94.3028L143.212 114.478V192.732L75.962 177.448V94.3028Z" />
                  <path pathLength="1" d="M63.7348 228.803L155.439 253.257V381.644L63.7348 348.019V228.803Z" />
                  <path pathLength="1" d="M75.962 247.144L143.212 265.485V362.691L75.962 338.237V247.144Z" />
                </g>
              </g>
            </svg>
          </div>
        </div>
        <!-- свет из проёма, который заливает весь экран -->
        <div class="door_flash"></div>
      </div>
    </section>

    <!-- ВРЕМЕННО: место для главы «Детство» (сделаем на следующем этапе) -->
    <section class="placeholder">
      <p>Здесь будет глава «Детство»</p>
    </section>

    <script src="./javascripts/glow.js"></script>
    <script src="./javascripts/door.js"></script>
  </body>
</html>
